# Installing & Verifying the Kyverno CLI - playground.
# A clean training solar system: the Kyverno controller v1.13.2 is running
# and the kyverno CLI is deliberately not installed. No task, no grading.
metadata:
  name: ats-009-playground-010-01
  docs:
    guide: docs/overview.md

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs the Kyverno controller v1.13.2 onto the kind cluster (the kyverno CLI is not installed)"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"

teardown:
  keepCluster: false
