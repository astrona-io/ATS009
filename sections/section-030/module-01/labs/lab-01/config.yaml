metadata:
  name: "ats-009-lab-005"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI binary"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "seed-test-suite"
      description: "Writes the policy, resources, and a broken kyverno-test.yaml to ~/kyverno-cli-lab"
      type: "file"
      source: "bootstrap/03-seed-test-suite.sh"

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: "apply-solution"
      description: "Writes the reference kyverno-test.yaml"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "manifest-names-both-pods"
      description: "kyverno-test.yaml still makes a claim about good-pod and bad-pod"
      type: "file"
      source: "validation/validate-manifest-names-both-pods.sh"
      hint: "Keep both Pods in the results list. Fix the expected result; do not delete bad-pod."
    - name: "suite-passes"
      description: "kyverno test . exits 0 and runs at least two tests"
      type: "file"
      source: "validation/validate-suite-passes.sh"
      hint: "Run kyverno test . in ~/kyverno-cli-lab and read the REASON column. One entry per Pod, each with its real result."
    - name: "good-pod-claim-is-real"
      description: "The suite fails when good-pod stops passing the rule"
      type: "file"
      source: "validation/validate-good-pod-claim-is-real.sh"
      hint: "good-pod must have its own claim: result pass for check-runAsNonRoot."
    - name: "bad-pod-claim-is-real"
      description: "The suite fails when bad-pod stops failing the rule"
      type: "file"
      source: "validation/validate-bad-pod-claim-is-real.sh"
      hint: "bad-pod must have its own claim: result fail for check-runAsNonRoot."
