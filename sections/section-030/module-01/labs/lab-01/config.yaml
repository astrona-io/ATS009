metadata:
  name: "ats-009-lab-005"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI binary"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "seed-test-suite"
      description: "Writes the policy, resources, and a broken kyverno-test.yaml to ~/kyverno-cli-lab"
      type: "file"
      source: "bootstrap/03-seed-test-suite.sh"

validation:
  scripts:
    - name: "verify-kyverno-test-suite"
      description: "Confirms kyverno-test.yaml truthfully asserts pass for good-pod and fail for bad-pod"
      type: "file"
      source: "validation/validate-completed.sh"
