# Testing Mutate and Generate Rules (PLAYGROUND): a clean practice environment.
# It installs the kyverno CLI 1.13.2 and writes mutate and generate policies and
# their input resources to ~/kyverno-cli-lab. No task, no grading, no `astrona submit`.
metadata:
  name: "ats-009-playground-030-02"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI 1.13.2 into /usr/local/bin"
      type: "file"
      source: "bootstrap/01-install-kyverno-cli.sh"
    - name: "seed-files"
      description: "Writes the mutate and generate policies and their input resources to ~/kyverno-cli-lab (no test manifest, no expected outputs)"
      type: "file"
      source: "bootstrap/02-seed-files.sh"

teardown:
  keepCluster: false
