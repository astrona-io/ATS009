# Variables, User Info, Exceptions And Large Suites (PLAYGROUND): a clean practice
# environment. It installs the kyverno CLI 1.13.2 and writes policies, resources,
# a values file, user info files and an exception to ~/kyverno-cli-lab. No task,
# no grading, no `astrona submit`.
metadata:
  name: "ats-009-playground-030-03"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI 1.13.2 into /usr/local/bin"
      type: "file"
      source: "bootstrap/01-install-kyverno-cli.sh"
    - name: "seed-files"
      description: "Writes policies, resources, values, user info and an exception to ~/kyverno-cli-lab (no test manifest)"
      type: "file"
      source: "bootstrap/02-seed-files.sh"

teardown:
  keepCluster: false
