metadata:
  name: "ats-009-lab-013"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI binary"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "seed-fixtures"
      description: "Writes policies, resources, values, user info and an exception to ~/kyverno-cli-lab (no test manifests)"
      type: "file"
      source: "bootstrap/03-seed-fixtures.sh"

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: "apply-solution"
      description: "Writes the three reference kyverno-test.yaml files under tests/"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "suites-found"
      description: "Three kyverno-test.yaml files under tests/ that use variables, userinfo and exceptions"
      type: "file"
      source: "validation/validate-suites-found.sh"
      hint: "One folder for each scenario under tests/, each with a file named kyverno-test.yaml: registry, platform-admin, platform-dev."
    - name: "suite-passes"
      description: "kyverno test . exits 0 and runs at least five tests"
      type: "file"
      source: "validation/validate-suite-passes.sh"
      hint: "Run kyverno test . in ~/kyverno-cli-lab. Paths in a manifest are relative to its own folder, so they start with ../../"
    - name: "variables-are-used"
      description: "The suite fails when the approved registry in the values file changes"
      type: "file"
      source: "validation/validate-variables-are-used.sh"
      hint: "The registry suite needs variables: ../../values/registry-values.yaml. Use the provided file."
    - name: "userinfo-is-used"
      description: "The suite fails when the admin badge loses cluster-admin"
      type: "file"
      source: "validation/validate-userinfo-is-used.sh"
      hint: "The admin suite needs userinfo: ../../userinfo/admin.yaml and the claim skip."
    - name: "exception-is-used"
      description: "The suite fails when the exception stops covering legacy-pod"
      type: "file"
      source: "validation/validate-exception-is-used.sh"
      hint: "The registry suite needs exceptions: ../../policies/legacy-exception.yaml and a skip claim for legacy-pod."
    - name: "failing-claims-are-real"
      description: "The suite fails when bad-registry-pod is repaired"
      type: "file"
      source: "validation/validate-failing-claims-are-real.sh"
      hint: "bad-registry-pod has no waiver, so it needs a fail claim."
