metadata:
  name: "ats-009-lab-006"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI binary"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "seed-fixtures"
      description: "Writes two policies and four resources to ~/kyverno-cli-lab; no test manifest is provided"
      type: "file"
      source: "bootstrap/03-seed-fixtures.sh"

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: "apply-solution"
      description: "Writes the reference kyverno-test.yaml"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "manifest-covers-all"
      description: "kyverno-test.yaml names both policies, all three rules and all four Pods"
      type: "file"
      source: "validation/validate-manifest-covers-all.sh"
      hint: "Every Pod, every policy and every rule must appear in the results list."
    - name: "suite-passes"
      description: "kyverno test . exits 0 and runs all twelve rule and Pod combinations"
      type: "file"
      source: "validation/validate-suite-passes.sh"
      hint: "Three rules times four Pods is twelve tests. Run kyverno test . and read the REASON column for the wrong ones."
    - name: "grouped"
      description: "Pods that share a verdict for a rule are grouped in one results entry"
      type: "file"
      source: "validation/validate-grouped.sh"
      hint: "Per rule, put every Pod with the same real verdict under one entry. Five entries are enough."
    - name: "nonroot-rule-asserted"
      description: "The suite fails when good-pod loses runAsNonRoot"
      type: "file"
      source: "validation/validate-nonroot-rule-asserted.sh"
      hint: "good-pod needs a pass claim for check-runAsNonRoot."
    - name: "image-rules-asserted"
      description: "The suite fails when good-pod uses the latest tag"
      type: "file"
      source: "validation/validate-image-rules-asserted.sh"
      hint: "good-pod needs a pass claim for validate-image-tag."
    - name: "failing-claims-are-real"
      description: "The suite fails when bad-both-pod is repaired"
      type: "file"
      source: "validation/validate-failing-claims-are-real.sh"
      hint: "bad-both-pod needs fail claims for check-runAsNonRoot and validate-image-tag."
