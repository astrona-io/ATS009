# JMESPath with the Kyverno CLI (PLAYGROUND) - a clean environment with the
# Kyverno CLI 1.13.2 and one Pod file to query. No task, no grading, no
# `astrona submit`.
metadata:
  name: "ats-009-playground-040-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI binary"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "seed-playground"
      description: "Writes the pod.json file used by the playground exercises"
      type: "file"
      source: "bootstrap/03-seed-playground.sh"

teardown:
  keepCluster: false
