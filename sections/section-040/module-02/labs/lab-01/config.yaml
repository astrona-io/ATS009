metadata:
  name: "ats-009-lab-014"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the kyverno CLI binary"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "seed-fixture"
      description: "Writes pods.json, request.json and settings.json and an empty answers folder"
      type: "file"
      source: "bootstrap/03-seed-fixture.sh"

# Applied only by `astrona test`: the reference answer files.
testing:
  init:
    - name: "apply-solution"
      description: "Writes the reference answer files"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "busiest-pod-answer"
      description: "busiest-pod.txt holds the Pod with the most restarts"
      type: "file"
      source: "validation/validate-busiest-pod.sh"
      hint: "max_by takes the list and an expression that starts with &, such as &status.restarts."
    - name: "running-count-answer"
      description: "running-count.txt holds the number of Running Pods"
      type: "file"
      source: "validation/validate-running-count.sh"
      hint: "Filter with [?status.phase=='Running'] and count the result with length."
    - name: "label-keys-answer"
      description: "label-keys.txt holds the sorted label keys of the first Pod"
      type: "file"
      source: "validation/validate-label-keys.sh"
      hint: "Wrap keys(...) in sort(...), because the order of keys is not fixed. Add -c for one line."
    - name: "token-answer"
      description: "token.txt holds the decoded token"
      type: "file"
      source: "validation/validate-token.sh"
      hint: "Use base64_decode on data.token in settings.json."
    - name: "memory-answer"
      description: "memory.txt holds the memory limit doubled"
      type: "file"
      source: "validation/validate-memory.sh"
      hint: "data.limits is a string of JSON. Open it with parse_json, then multiply the memory by a backtick number."
    - name: "uptime-answer"
      description: "uptime.txt holds the time since the start"
      type: "file"
      source: "validation/validate-uptime.sh"
      hint: "time_since takes three arguments: a layout (an empty string), the start and the end."

teardown:
  keepCluster: false
