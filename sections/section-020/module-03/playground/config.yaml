# Exceptions, Warnings And Exit Codes In Pipelines (PLAYGROUND).
# A clean sandbox: a kind cluster (no Kyverno controller), the kyverno CLI
# 1.13.2 and two example Pods in /root/apply-gate. No task, no grading.
metadata:
  name: ats-009-playground-020-03
  docs:
    guide: docs/overview.md

bootstrap:
  init:
    - name: "install-kyverno-cli"
      description: "Installs the standalone kyverno CLI v1.13.2 into /usr/local/bin"
      type: "file"
      source: "bootstrap/01-install-kyverno-cli.sh"
    - name: "setup-gate-playground"
      description: "Creates the apps namespace and the example Pod files"
      type: "file"
      source: "bootstrap/02-setup-gate-playground.sh"

teardown:
  keepCluster: false
