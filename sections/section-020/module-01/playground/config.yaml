# Applying Policies with the Kyverno CLI (PLAYGROUND).
# A clean sandbox: a kind cluster with the Kyverno controller v1.13.2, the
# kyverno CLI 1.13.2, two Pods in the namespace `apps` and the example files in
# /root/apply-lab. No task, no grading, no `astrona submit`.
metadata:
  name: ats-009-playground-020-01
  docs:
    guide: docs/overview.md

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno v1.13.2 onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the standalone kyverno CLI v1.13.2 into /usr/local/bin"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "setup-apply-playground"
      description: "Creates the apps namespace, two Pods and the example policy and resource files"
      type: "file"
      source: "bootstrap/03-setup-apply-playground.sh"

teardown:
  keepCluster: false
