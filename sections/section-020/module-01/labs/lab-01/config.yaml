metadata:
  name: "ats-009-lab-003"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "install-kyverno-cli"
      description: "Installs the standalone kyverno CLI binary"
      type: "file"
      source: "bootstrap/02-install-kyverno-cli.sh"
    - name: "setup-apply-lab"
      description: "Creates the apps namespace, two pre-existing Pods, and local policy/resource fixtures"
      type: "file"
      source: "bootstrap/03-setup-apply-lab.sh"

validation:
  scripts:
    - name: "verify-apply-workflow"
      description: "Confirms the offline apply results, the live policy enforcement, and the cluster policy report"
      type: "file"
      source: "validation/validate-completed.sh"
