# Mutate And Generate With apply (PLAYGROUND).
# A clean sandbox: a kind cluster (no Kyverno controller), the kyverno CLI
# 1.13.2 and example resource files in /root/apply-mutate. No task, no grading.
metadata:
  name: ats-009-playground-020-02
  docs:
    guide: docs/overview.md

bootstrap:
  init:
    - name: "install-kyverno-cli"
      description: "Installs the standalone kyverno CLI v1.13.2 into /usr/local/bin"
      type: "file"
      source: "bootstrap/01-install-kyverno-cli.sh"
    - name: "setup-mutate-playground"
      description: "Creates the apps namespace and the example resource files"
      type: "file"
      source: "bootstrap/02-setup-mutate-playground.sh"

teardown:
  keepCluster: false
