        path: sections/section-040/module-01/course.md
      - type: reading
        title: "Module 1.1: JMESPath Fundamentals via kyverno jp query"
        path: sections/section-040/module-01/course-01-jmespath-fundamentals-via-kyverno-jp-query.md
