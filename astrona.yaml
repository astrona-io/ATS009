        path: sections/section-030/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 35m
        topic: testing
        task_kind: build
        tags: [kyverno-test, test-manifest, test-results, resource-grouping, validate-rule, pattern, require-tests]
        learning_goals:
          - Work out the real result of three rules for four Pods
