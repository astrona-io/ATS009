  - id: module-040
    title: "Section 040: kyverno jp"
    description: >
      Debug the JMESPath expressions Kyverno policies rely on before they
      ever touch a cluster: querying JSON with kyverno jp query, and using
      Kyverno's custom JMESPath functions the same way context and
      preconditions blocks do.

    content:
