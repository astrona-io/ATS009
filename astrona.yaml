        title: "Kyverno Test Suite Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: testing
        task_kind: troubleshooting
        tags: [kyverno-test, test-manifest, test-results, resource-grouping, require-tests, ci-gate]
        learning_goals:
          - Read kyverno test output to find which expected result is wrong
          - Fix a test manifest so each resource asserts its real result
        resources:
          - name: "Testing policies"
            url: https://kyverno.io/docs/guides/testing-policies/
          - name: "kyverno test reference"
            url: https://kyverno.io/docs/kyverno-cli/reference/kyverno_test/

      - type: reading
